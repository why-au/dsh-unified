# cordis.patch.yml —— DSH 插件市场清单（dsh-unified）

# 借鉴 dsh-subscriptions 与 dsh-connect 的清单结构
# 安装方式：dsh plugin --profile web add dsh-unified

version: 1.0.0

services:
  - id: dsh-unified
    name: dsh-unified
    description: 聚合订阅、API key 与 IDE 模型渠道的 DSH 插件，提供多账号轮换与统一渠道面板；各渠道可用性需按部署环境验证
    entry:
      type: module
      path: ./lib/index.js
    inject:
      - llm
      - credentials
      - webServer
      - settings